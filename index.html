<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>غذای شرکت</title>
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:#f6f7fb;color:#1f2937;padding-bottom:70px}
header{background:#0f766e;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header small{opacity:.85}
main{max-width:560px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0001}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:#0f766e;color:#fff;cursor:pointer}
button.sec{background:#e5e7eb;color:#111}button.red{background:#b91c1c}button:disabled{opacity:.5}
input,select{font:inherit;width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;margin:4px 0}
.opt{display:block;width:100%;text-align:right;background:#f3f4f6;color:#111;margin:6px 0;padding:14px;border:2px solid transparent}
.opt.on{border-color:#0f766e;background:#ccfbf1;font-weight:bold}
.mut{color:#6b7280;font-size:13px}.err{color:#b91c1c}.ok{color:#047857}
nav{position:fixed;bottom:0;right:0;left:0;background:#fff;display:flex;border-top:1px solid #e5e7eb;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:#6b7280;border-radius:0;padding:14px 4px;font-size:13px}nav button.on{color:#0f766e;font-weight:bold}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #f1f5f9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#login{text-align:center;padding:40px 16px}
</style></head><body>
<header><div><b>🍽️ غذای شرکت</b><br><small id="hd"></small></div><button class="sec" id="out" hidden>خروج</button></header>
<main id="app"></main><nav id="nav" hidden></nav>
<script src="./config.js"></script>
<script src="./app.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.gsiReady&&window.gsiReady()"></script>
</body></html>
